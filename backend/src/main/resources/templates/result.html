<!-- 추천 결과 페이지 -->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>추천 결과 - 데이트코스 추천</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="result.css">
  <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=2a8976a8da89c67bc06504f361dd1b69&libraries=services&autoload=false"></script>
</head>
<body class="bg-gradient-to-br from-pink-100 via-purple-50 to-blue-50 relative min-h-screen">

  <div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
    <div class="absolute top-0 left-1/3 w-96 h-96 bg-pink-300 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-blob"></div>
    <div class="absolute bottom-0 right-1/3 w-96 h-96 bg-purple-300 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-blob animation-delay-2000"></div>
  </div>

  <header class="border-b bg-white/90 backdrop-blur-md sticky top-0 z-50 shadow-lg">
    <div class="max-w-5xl mx-auto px-4 py-5">
      <div class="flex items-center justify-between mb-4">
        <div class="flex items-center gap-3">
          <div class="w-14 h-14 bg-gradient-to-br from-pink-400 via-purple-400 to-purple-500 rounded-full flex items-center justify-center shadow-xl shadow-pink-300/50 animate-pulse-slow">
            <svg class="w-7 h-7 text-white" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>
          </div>
          <div>
            <h1 class="text-2xl font-bold bg-gradient-to-r from-pink-500 to-purple-600 bg-clip-text text-transparent">AI 추천 데이트 코스</h1>
            <p class="text-sm text-gray-500">당신을 위한 맞춤 코스</p>
          </div>
        </div>
        <div class="flex items-center gap-2">
          <button id="btnNavCalendar" class="p-2 hover:bg-blue-100 rounded-md transition-colors"><svg class="w-5 h-5 text-gray-700" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg></button>
          <button id="btnNavMyPage" class="p-2 hover:bg-purple-100 rounded-md transition-colors"><svg class="w-5 h-5 text-gray-700" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></button>
          <button id="btnShare" class="p-2 hover:bg-purple-100 rounded-md transition-colors"><svg class="w-5 h-5 text-gray-700" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" x2="15.42" y1="13.51" y2="17.49"/><line x1="15.41" x2="8.59" y1="6.51" y2="10.49"/></svg></button>
          <button id="btnSaveCourse" class="p-2 hover:bg-pink-100 rounded-md transition-colors">
            <svg id="iconSave" class="w-5 h-5 text-gray-700" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/></svg>
          </button>
        </div>
      </div>
        <!-- 💡 글자 크기에 딱 맞게 줄어드는 요약 바 (inline-flex 사용) -->
        <div class="inline-flex items-center gap-4 bg-purple-50 px-5 py-3 rounded-full mb-6 shadow-sm border border-purple-100">
            <!-- 🕒 선택한 시간대 -->
            <div class="flex items-center text-purple-700 font-bold text-sm">
                <svg class="w-4 h-4 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                <span id="summaryTimeRange">00:00 ~ 00:00</span>
            </div>
            <!-- 📍 장소 개수 -->
            <div class="flex items-center text-purple-700 font-bold text-sm">
                <svg class="w-4 h-4 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.243-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                <span id="summaryPlaceCount">0개 장소</span>
            </div>
        </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-8 space-y-8 pb-32 relative z-10">
    
    <div class="rounded-xl border-0 shadow-2xl bg-white/90 backdrop-blur-sm overflow-hidden">
      <div class="p-6 pb-3">
        <h3 class="text-xl font-bold flex items-center gap-2">
          <svg class="w-5 h-5 text-blue-500" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
          코스 지도
        </h3>
      </div>
      <div class="p-6 pt-0">
        <div class="relative h-[400px] bg-gradient-to-br from-blue-50 to-green-50 rounded-xl overflow-hidden border-2 border-gray-200 shadow-inner">
          <div class="absolute inset-0">
            <svg class="w-full h-full opacity-20">
              <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M 20 0 L 0 0 0 20" fill="none" stroke="gray" stroke-width="0.5"/></pattern>
              <rect width="100%" height="100%" fill="url(#grid)" />
            </svg>
          </div>
          <div id="simpleMapContainer" class="absolute inset-0"></div> </div>
      </div>
    </div>

    <div id="courseListContainer" class="space-y-0"></div>

  </main>

  <div class="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t-2 py-4 px-4 shadow-2xl z-50">
  <div class="max-w-5xl mx-auto flex flex-col gap-3">
    
    <!-- 상단 1열: 서브 버튼 2개 (다시 추천 / 보관하기) -->
    <div class="flex gap-3">
      <!-- 1. 다시 추천받기 (원래 있던 id="btnRetry" 유지) -->
      <button id="btnRetry" class="inline-flex items-center justify-center rounded-md border-2 border-gray-200 bg-white hover:bg-gray-100 flex-1 h-12 text-sm font-semibold transition-colors">
        <svg class="w-4 h-4 mr-1.5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
        다시 추천
      </button>

<!-- 💡 보관하기 버튼 (onclick으로 직접 함수 연결) -->
      <button onclick="saveCurrentCourse()" class="inline-flex items-center justify-center rounded-md border-2 border-purple-200 bg-purple-50 text-purple-600 hover:bg-purple-100 flex-1 h-12 text-sm font-bold transition-colors">
        <svg class="w-4 h-4 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4"></path></svg>
        보관하기
      </button>
    </div>

    <!-- 하단 2열: 메인 버튼 1개 (캘린더 추가) -->
    <!-- 3. 일정 추가하기 (카카오맵 연결 싹 끊어냄!) -->
    <button id="btnAddToCalendar" class="inline-flex items-center justify-center rounded-md text-white bg-gradient-to-r from-pink-500 via-purple-500 to-purple-600 hover:from-pink-600 w-full h-14 text-base font-bold shadow-lg transition-transform hover:scale-105">
      <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
      캘린더에 일정 추가하기
      <svg class="w-5 h-5 ml-2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
    </button>

  </div>
</div>

  <div id="modalAlternatives" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-[100] p-4">
    <div class="rounded-xl border bg-white shadow-2xl w-full max-w-3xl max-h-[85vh] overflow-hidden flex flex-col">
      <div class="p-6 border-b bg-gradient-to-r from-purple-50 to-pink-50 shrink-0">
        <h3 class="text-2xl font-bold flex items-center gap-2">
          <svg class="w-6 h-6 text-purple-600" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
          다른 장소 선택하기
        </h3>
        <p class="text-base text-gray-600 mt-1">마음에 드는 장소를 클릭하여 변경하세요</p>
      </div>
      <div id="alternativesContainer" class="p-6 space-y-3 overflow-y-auto flex-1">
        </div>
      <div class="p-4 border-t shrink-0">
        <button id="btnCancelAlternatives" class="w-full h-12 border-2 border-gray-200 rounded-md font-semibold hover:bg-gray-50">취소</button>
      </div>
    </div>
  </div>

<!-- 🌟 세련되게 바뀐 상세 정보 팝업창 -->
<div id="modalPlaceDetail" class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-[100] hidden px-4 transition-all duration-300">
  <div class="bg-white rounded-[24px] w-full max-w-md overflow-hidden shadow-2xl relative">
    
    <!-- 상단 배너 (사진이 없는 아쉬움을 예쁜 그라데이션으로 채웁니다) -->
    <div class="h-32 bg-gradient-to-r from-pink-400 via-purple-400 to-indigo-400 relative">
      <button id="btnDetailClose" class="absolute top-4 right-4 bg-black/20 hover:bg-black/40 text-white rounded-full p-2 backdrop-blur-md transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
      </button>
      <!-- 아이콘이 배너에 걸쳐있도록 디자인 -->
      <div id="detailEmoji" class="absolute -bottom-8 left-6 w-16 h-16 bg-white rounded-full flex items-center justify-center text-3xl shadow-lg border-4 border-white">
        📍
      </div>
    </div>

    <!-- 본문 내용 -->
    <div class="pt-12 pb-6 px-6">
      <div class="flex items-center gap-2 mb-2">
        <h2 id="detailName" class="text-2xl font-bold text-gray-900 tracking-tight">장소 이름</h2>
        <span id="detailCat" class="px-2.5 py-1 bg-purple-50 text-purple-600 text-xs font-bold rounded-lg border border-purple-100">AI 추천</span>
      </div>
      
      <!-- AI 추천 이유 (말풍선 느낌) -->
      <div class="bg-gray-50/80 p-4 rounded-xl border border-gray-100 mt-3 mb-5">
        <p id="detailDesc" class="text-gray-700 text-sm leading-relaxed">추천 이유가 들어갑니다.</p>
      </div>

      <!-- 요약 정보 그리드 -->
      <div class="grid grid-cols-2 gap-3 mb-5">
         <div class="bg-gray-50 rounded-xl p-3 flex items-center gap-3 border border-gray-100">
            <div class="text-yellow-400 text-lg">⭐</div>
            <div>
               <div id="detailRating" class="font-bold text-gray-800 text-sm">4.5</div>
               <div id="detailReviewCount" class="text-[11px] text-gray-500">(120개 리뷰)</div>
            </div>
         </div>
         <div class="bg-gray-50 rounded-xl p-3 flex items-center gap-3 border border-gray-100">
            <div class="text-blue-400 text-lg">🕒</div>
            <div>
               <div class="font-bold text-gray-800 text-sm">예상 소요</div>
               <div id="detailTime" class="text-[11px] text-gray-500">2시간</div>
            </div>
         </div>
      </div>

      <div class="flex items-start gap-2 text-sm text-gray-600 bg-gray-50 p-3 rounded-xl border border-gray-100">
         <span class="shrink-0">📍</span>
         <span id="detailAddr" class="break-keep">주소가 들어갑니다</span>
      </div>

      <!-- 카카오맵 연동 버튼이 들어갈 자리 -->
      <div id="reviewsContainer" class="mt-6"></div>
      
    </div>
  </div>
</div>

  <script src="result.js"></script>

  <!-- 🌟 [추가] 코스 제목 설정 후 캘린더에 저장하는 팝업 -->
<div id="saveCourseModal" class="hidden fixed inset-0 bg-black/40 backdrop-blur-sm z-50 items-center justify-center p-4">
  <div class="bg-white rounded-[2rem] max-w-sm w-full p-8 shadow-2xl animate-in fade-in zoom-in duration-200">
    <div class="mb-6 text-center">
      <div class="w-12 h-12 bg-purple-50 text-purple-600 rounded-2xl flex items-center justify-center mx-auto mb-3">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
      </div>
      <h3 class="text-xl font-extrabold text-gray-900">캘린더에 저장하기</h3>
      <p class="text-sm text-gray-500 mt-1">저장할 데이트 코스의 이름을 정해주세요.</p>
    </div>
    <!-- 🌟 [추가] 어느 방에 저장할지 선택하는 버튼 -->
<div class="mb-4 text-left">
  <label class="block text-xs font-bold text-gray-500 mb-2">어느 방에 추가할까요?</label>
  <div class="flex gap-2">
    <!-- 연인방 버튼 (기본 선택) -->
    <label class="flex-1 cursor-pointer">
      <input type="radio" name="roomType" value="couple" class="peer sr-only" checked>
      <div class="h-10 flex items-center justify-center rounded-xl border border-gray-200 text-sm font-bold text-gray-400 peer-checked:bg-pink-50 peer-checked:text-pink-600 peer-checked:border-pink-300 transition-all">
        💕 연인방
      </div>
    </label>
    <!-- 친구방 버튼 -->
    <label class="flex-1 cursor-pointer">
      <input type="radio" name="roomType" value="friend" class="peer sr-only">
      <div class="h-10 flex items-center justify-center rounded-xl border border-gray-200 text-sm font-bold text-gray-400 peer-checked:bg-blue-50 peer-checked:text-blue-600 peer-checked:border-blue-300 transition-all">
        👫 친구방
      </div>
    </label>
  </div>
</div>
    <input type="text" id="customCourseTitle" placeholder="예: 북촌 한옥마을 감성 데이트" class="w-full h-12 px-4 rounded-xl border border-gray-200 text-sm font-bold focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500 mb-6 transition-all">
    
    <div class="flex gap-2">
      <button id="btnCancelSave" class="flex-1 py-3.5 bg-gray-100 hover:bg-gray-200 text-gray-700 text-sm font-bold rounded-2xl transition-colors">취소</button>
      <button id="btnConfirmSave" class="flex-1 py-3.5 bg-gradient-to-r from-pink-500 to-purple-600 hover:from-pink-600 text-white text-sm font-bold rounded-2xl shadow-md transition-all">저장 완료</button>
    </div>
  </div>
</div>

</body>
</html>
