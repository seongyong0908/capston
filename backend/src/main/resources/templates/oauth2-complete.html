<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 확인 중</title>
</head>
<body>
  <p>로그인 정보를 확인하고 있습니다...</p>
  <script>
    fetch('/api/session')
      .then(async response => {
        if (!response.ok) {
          throw new Error(await response.text());
        }
        return response.json();
      })
      .then(session => {
        localStorage.setItem('loginId', session.loginId);
        if (session.needsTasteSetup) {
          localStorage.removeItem('userTaste');
          window.location.replace('/taste-setup');
        } else {
          localStorage.setItem('userTaste', 'done');
          window.location.replace('/home');
        }
      })
      .catch(error => {
        console.error('소셜 로그인 완료 처리 실패:', error);
        document.body.textContent = '로그인 정보를 불러오지 못했습니다. 다시 로그인해 주세요.';
      });
  </script>
</body>
</html>
