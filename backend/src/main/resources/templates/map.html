<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="utf-8">
    <title>데이트 코스 지도 📍</title>
    <style>
        /* 화면 꽉 차게 설정 */
        body, html { margin: 0; padding: 0; height: 100%; }
        #map { width: 100vw; height: 100vh; }
        
        /* 상단 제목 예쁘게 꾸미기 */
        .map-title {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            z-index: 10; background: white; padding: 10px 20px;
            border-radius: 20px; box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            font-family: sans-serif; font-weight: bold;
        }
    </style>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div class="map-title" id="findNearbyBtn" style="cursor:pointer;">🔍 이 지역에서 찾기</div>

    <div id="map"></div>


    // 내 위치로 돌아갈 수 있는 버튼 추가
    <button id="myLocationBtn" style="position: absolute; bottom: 90px; right: 20px; z-index: 99999; background-color: white; color: #333; border: 2px solid #333; border-radius: 50%; width: 50px; height: 50px; font-size: 20px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3);">
    📍
    </button>

    <!-- 하단 네비게이션 (home 화면과 동일한 4개 메뉴, 현재 화면인 "지도보기"가 활성화 표시됨) -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t-2 border-gray-200 shadow-2xl" style="z-index: 100000;">
      <div class="max-w-7xl mx-auto px-2">
        <div class="grid grid-cols-4">
          <button onclick="window.location.href='/home'" class="relative flex flex-col items-center justify-center py-3 px-1 transition-all text-gray-500 hover:text-purple-500">
            <svg class="w-6 h-6 mb-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <span class="text-xs font-semibold">홈</span>
          </button>

          <button id="navActiveBtn" onclick="window.location.href='/map'" class="relative flex flex-col items-center justify-center py-3 px-1 transition-all text-purple-600">
            <svg id="navActiveIcon" class="w-6 h-6 mb-1 fill-purple-100 stroke-purple-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
            <span class="text-xs font-semibold">지도보기</span>
            <span id="navActiveBar" class="absolute bottom-0 w-8 h-0.5 bg-purple-600 rounded-full"></span>
          </button>

          <button onclick="window.location.href='/calendar'" class="relative flex flex-col items-center justify-center py-3 px-1 transition-all text-gray-500 hover:text-purple-500">
            <svg class="w-6 h-6 mb-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/><path d="M8 14h.01"/><path d="M12 14h.01"/><path d="M16 14h.01"/><path d="M8 18h.01"/><path d="M12 18h.01"/><path d="M16 18h.01"/></svg>
            <span class="text-xs font-semibold">캘린더</span>
          </button>

          <button onclick="window.location.href='/mypage'" class="relative flex flex-col items-center justify-center py-3 px-1 transition-all text-gray-500 hover:text-purple-500">
            <svg class="w-6 h-6 mb-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <span class="text-xs font-semibold">마이페이지</span>
          </button>
        </div>
      </div>
    </nav>

    <script>
      // 홈 화면에서 선택한 방의 색상에 맞춰 하단 네비게이션의 "지도보기" 탭 색상을 맞춤
      (function () {
        const ROOM_NAV_COLORS = {
          couple: { text: 'text-rose-600', fill: 'fill-rose-100', stroke: 'stroke-rose-600', bar: 'bg-rose-600' },
          friend: { text: 'text-orange-600', fill: 'fill-orange-100', stroke: 'stroke-orange-600', bar: 'bg-orange-600' },
          family: { text: 'text-emerald-600', fill: 'fill-emerald-100', stroke: 'stroke-emerald-600', bar: 'bg-emerald-600' },
          default: { text: 'text-purple-600', fill: 'fill-purple-100', stroke: 'stroke-purple-600', bar: 'bg-purple-600' }
        };
        const type = localStorage.getItem('activeRoomType') || 'default';
        const c = ROOM_NAV_COLORS[type] || ROOM_NAV_COLORS.default;
        const navBtn = document.getElementById('navActiveBtn');
        const navIcon = document.getElementById('navActiveIcon');
        const navBar = document.getElementById('navActiveBar');
        if (navBtn) navBtn.className = `relative flex flex-col items-center justify-center py-3 px-1 transition-all ${c.text}`;
        if (navIcon) navIcon.setAttribute('class', `w-6 h-6 mb-1 ${c.fill} ${c.stroke}`);
        if (navBar) navBar.className = `absolute bottom-0 w-8 h-0.5 ${c.bar} rounded-full`;
      })();
    </script>

    <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=2a8976a8da89c67bc06504f361dd1b69&libraries=services&autoload=false"></script>
    
    <script th:inline="javascript">

        window.onload = function() {

            kakao.maps.load(function() {
                const container = document.getElementById("map");
                const options = {
                    center: new kakao.maps.LatLng(37.5665, 126.9780),
                    level: 5
                };

                const map = new kakao.maps.Map(container, options);

                // 현재 내 위치를 저장할 변수 (아직 못 찾았으면 null)
                let myPosition = null;
                let myMarker = null;
                let placeMarkers = []; // 찍힌 장소 마커들을 기억해서 나중에 지울 때 사용
                let currentPopup = null; // 지금 열려있는 정보 카드 (다른 곳 클릭 시 닫기 위해 기억해둠)

                // 두 좌표 사이의 실제 거리(km)를 구하는 하버사인 공식
                function getDistanceKm(lat1, lng1, lat2, lng2) {
                    const R = 6371; // 지구 반지름(km)
                    const dLat = (lat2 - lat1) * Math.PI / 180;
                    const dLng = (lng2 - lng1) * Math.PI / 180;
                    const a =
                        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                        Math.sin(dLng / 2) * Math.sin(dLng / 2);
                    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
                    return R * c;
                }

                // 카테고리별 아이콘 + 색상 (심플한 카드 디자인에 사용)
                const CATEGORY_STYLE = {
                    "카페":         { emoji: "☕", bg: "#FFF3E0", color: "#F57C00" },
                    "식당":         { emoji: "🍽️", bg: "#FFEBEE", color: "#E53935" },
                    "문화예술":     { emoji: "🎭", bg: "#EDE7F6", color: "#7E57C2" },
                    "공원산책":     { emoji: "🌳", bg: "#E8F5E9", color: "#43A047" },
                    "쇼핑":         { emoji: "🛍️", bg: "#FCE4EC", color: "#D81B60" },
                    "스포츠레저":   { emoji: "⚽", bg: "#E3F2FD", color: "#1E88E5" },
                    "실내액티비티": { emoji: "🎮", bg: "#E0F7FA", color: "#00838F" }
                };
                const DEFAULT_CATEGORY_STYLE = { emoji: "📍", bg: "#F5F5F5", color: "#757575" };

                // 데이터에 섞여 있을 수 있는 HTML 태그를 제거하고, 카드 안에 깔끔하게 들어가도록 글자 수를 제한
                function cleanAndTruncate(text, maxLen) {
                    if (!text) return '';
                    const plain = text.replace(/<[^>]*>/g, '').replace(/\s+/g, ' ').trim();
                    if (plain.length > maxLen) {
                        return plain.slice(0, maxLen) + '...';
                    }
                    return plain;
                }

                // 배열을 무작위로 섞는 함수 (버튼을 누를 때마다 다른 장소가 나오게 하기 위함)
                function shuffleArray(arr) {
                    const array = arr.slice();
                    for (let i = array.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [array[i], array[j]] = [array[j], array[i]];
                    }
                    return array;
                }

                // 열려있는 정보 카드를 닫는 헬퍼
                function closeCurrentPopup() {
                    if (currentPopup) {
                        currentPopup.setMap(null);
                        currentPopup = null;
                    }
                }

                // 장소 정보를 보여주는 심플하고 예쁜 카드(말풍선) 만들기
                function createPopupContent(place) {
                    const style = CATEGORY_STYLE[place.category] || DEFAULT_CATEGORY_STYLE;

                    const wrapper = document.createElement('div');
                    wrapper.style.position = 'relative';
                    wrapper.style.whiteSpace = 'normal';

                    const card = document.createElement('div');
                    card.style.background = '#fff';
                    card.style.borderRadius = '16px';
                    card.style.boxShadow = '0 8px 24px rgba(0,0,0,0.18)';
                    card.style.padding = '14px 16px';
                    card.style.width = '220px';
                    card.style.fontFamily = "'Apple SD Gothic Neo', sans-serif";
                    card.style.boxSizing = 'border-box';
                    card.style.whiteSpace = 'normal'; // 카카오맵 오버레이 컨테이너의 white-space: nowrap이 상속되는 걸 막아서 줄바꿈이 되게 함

                    // 닫기(x) 버튼
                    const closeBtn = document.createElement('button');
                    closeBtn.innerHTML = '&times;';
                    closeBtn.style.position = 'absolute';
                    closeBtn.style.top = '8px';
                    closeBtn.style.right = '8px';
                    closeBtn.style.width = '20px';
                    closeBtn.style.height = '20px';
                    closeBtn.style.border = 'none';
                    closeBtn.style.borderRadius = '50%';
                    closeBtn.style.background = '#f1f1f1';
                    closeBtn.style.color = '#888';
                    closeBtn.style.fontSize = '14px';
                    closeBtn.style.lineHeight = '1';
                    closeBtn.style.cursor = 'pointer';
                    closeBtn.onclick = closeCurrentPopup;
                    card.appendChild(closeBtn);

                    // 상단: 아이콘 + 이름/카테고리
                    const header = document.createElement('div');
                    header.style.display = 'flex';
                    header.style.alignItems = 'center';
                    header.style.gap = '10px';
                    header.style.marginBottom = '10px';
                    header.style.paddingRight = '18px';

                    const iconBox = document.createElement('div');
                    iconBox.style.width = '36px';
                    iconBox.style.height = '36px';
                    iconBox.style.borderRadius = '10px';
                    iconBox.style.background = style.bg;
                    iconBox.style.display = 'flex';
                    iconBox.style.alignItems = 'center';
                    iconBox.style.justifyContent = 'center';
                    iconBox.style.fontSize = '18px';
                    iconBox.style.flexShrink = '0';
                    iconBox.textContent = style.emoji;

                    const titleBox = document.createElement('div');
                    titleBox.style.minWidth = '0'; // flex 안에서 자식이 줄바꿈되도록
                    titleBox.style.flex = '1';
                    const nameEl = document.createElement('div');
                    nameEl.style.fontWeight = '700';
                    nameEl.style.fontSize = '14px';
                    nameEl.style.color = '#222';
                    nameEl.style.lineHeight = '1.3';
                    nameEl.style.wordBreak = 'break-word';
                    nameEl.textContent = cleanAndTruncate(place.placeName, 24);

                    const categoryEl = document.createElement('div');
                    categoryEl.style.fontSize = '11px';
                    categoryEl.style.fontWeight = '600';
                    categoryEl.style.color = style.color;
                    categoryEl.style.marginTop = '2px';
                    categoryEl.textContent = place.category ?? '';

                    titleBox.appendChild(nameEl);
                    titleBox.appendChild(categoryEl);
                    header.appendChild(iconBox);
                    header.appendChild(titleBox);
                    card.appendChild(header);

                    // 주소 (간략하게, 카드 폭에 맞춰 자동 줄바꿈)
                    if (place.address) {
                        const addressEl = document.createElement('div');
                        addressEl.style.fontSize = '12px';
                        addressEl.style.color = '#666';
                        addressEl.style.lineHeight = '1.4';
                        addressEl.style.marginBottom = '4px';
                        addressEl.style.wordBreak = 'break-word';
                        addressEl.style.overflowWrap = 'break-word';
                        addressEl.textContent = '📍 ' + cleanAndTruncate(place.address, 40);
                        card.appendChild(addressEl);
                    }

                    // 설명 (HTML 태그 제거 + 간략하게 요약해서 카드 안에 딱 맞게 표시)
                    if (place.description) {
                        const descText = cleanAndTruncate(place.description, 45);
                        if (descText) {
                            const descEl = document.createElement('div');
                            descEl.style.fontSize = '11px';
                            descEl.style.color = '#999';
                            descEl.style.lineHeight = '1.4';
                            descEl.style.wordBreak = 'break-word';
                            descEl.style.overflowWrap = 'break-word';
                            descEl.textContent = descText;
                            card.appendChild(descEl);
                        }
                    }

                    wrapper.appendChild(card);

                    // 카드 아래쪽의 작은 꼬리(말풍선 느낌)
                    const tail = document.createElement('div');
                    tail.style.position = 'absolute';
                    tail.style.bottom = '-6px';
                    tail.style.left = '50%';
                    tail.style.width = '12px';
                    tail.style.height = '12px';
                    tail.style.background = '#fff';
                    tail.style.transform = 'translateX(-50%) rotate(45deg)';
                    tail.style.boxShadow = '2px 2px 4px rgba(0,0,0,0.08)';
                    wrapper.appendChild(tail);

                    return wrapper;
                }

                // ==========================================
                // 기능 1. 버튼 클릭 시 "현재 화면에 보이는 영역" 안의 장소 마커 찍기
                // (확대/축소하거나 다른 지역으로 화면을 옮겨도, 그 순간 화면에 보이는 범위 기준으로 검색됨)
                // ==========================================
               document.getElementById("findNearbyBtn").addEventListener("click", function () {
                 // 현재 지도 화면에 실제로 보이는 사각형 범위(남서/북동 좌표)를 가져옴
                 const viewBounds = map.getBounds();
                 const sw = viewBounds.getSouthWest();
                 const ne = viewBounds.getNorthEast();

                 fetch(`/api/place/in-bounds?swLat=${sw.getLat()}&swLng=${sw.getLng()}&neLat=${ne.getLat()}&neLng=${ne.getLng()}`)
                    .then(response => response.json())
                    .then(placesInView => {
                        if (placesInView.length === 0) {
                            alert("지금 화면에 보이는 범위엔 등록된 데이트 코스가 없어요 😢");
                            return;
                        }

                        // 매번 다른 장소가 나오도록 무작위로 섞은 뒤 10곳만 선택
                        const selectedPlaces = shuffleArray(placesInView).slice(0, 10);

                        // 이전 검색 결과(마커/정보 카드)를 지우고 새로 그림
                        placeMarkers.forEach(m => m.setMap(null));
                        placeMarkers = [];
                        closeCurrentPopup();

                        selectedPlaces.forEach(place => {
                            const markerPosition = new kakao.maps.LatLng(place.latitude, place.longitude);
                            const marker = new kakao.maps.Marker({
                                position: markerPosition,
                                title: place.placeName
                            });
                            marker.setMap(map);
                            placeMarkers.push(marker);

                            // 심플하고 예쁜 카드 스타일 정보창 (CustomOverlay로 직접 디자인)
                            const popup = new kakao.maps.CustomOverlay({
                                position: markerPosition,
                                content: createPopupContent(place),
                                yAnchor: 1.3,
                                zIndex: 10
                            });

                            kakao.maps.event.addListener(marker, 'click', function () {
                                // 다른 장소의 정보 카드가 열려있으면 먼저 닫고 새 카드를 연다
                                closeCurrentPopup();
                                popup.setMap(map);
                                currentPopup = popup;
                            });
                        });

                        // 화면(확대/축소, 위치)은 사용자가 보던 그대로 유지 - 여기서 강제로 옮기지 않음

                        alert(`지금 화면에서 데이트 코스 ${selectedPlaces.length}곳을 찾았어요! 🎉`);
                    })
                    .catch(err => {
                        console.error("장소 데이터를 불러오는 데 실패했습니다:", err);
                        alert("장소 데이터를 불러오는 데 실패했어요.");
                    });
                });

                // 마커가 아닌 지도의 빈 공간을 클릭(터치)하면 열려있는 정보 카드를 닫는다
                kakao.maps.event.addListener(map, 'click', function () {
                    closeCurrentPopup();
                });

                // ==========================================
                // 기능 2. 내 현재 위치 찾아서 지도 이동하기
                // ==========================================
                function moveToMyLocation(showAlert) {
                    if (navigator.geolocation) {
                        navigator.geolocation.getCurrentPosition(
                            function(pos) {
                                const myLat = pos.coords.latitude;
                                const myLng = pos.coords.longitude;
                                myPosition = { lat: myLat, lng: myLng };

                                const myPos = new kakao.maps.LatLng(myLat, myLng);
                                map.setCenter(myPos);

                                if (myMarker) {
                                    myMarker.setMap(null); // 기존 내 위치 마커 제거
                                }

                                // 파란 점 스타일의 내 위치 마커
                                const myMarkerContent = document.createElement('div');
                                myMarkerContent.style.width = '20px';
                                myMarkerContent.style.height = '20px';
                                myMarkerContent.style.borderRadius = '50%';
                                myMarkerContent.style.backgroundColor = '#4285F4';
                                myMarkerContent.style.border = '3px solid white';
                                myMarkerContent.style.boxShadow = '0 0 6px rgba(0,0,0,0.4)';

                                myMarker = new kakao.maps.CustomOverlay({
                                    position: myPos,
                                    content: myMarkerContent,
                                    yAnchor: 0.5
                                });
                                myMarker.setMap(map);

                                if (showAlert) {
                                    alert("내 위치로 이동했어요!");
                                }
                            },
                            function(error) {
                                console.error("위치 정보를 가져오는 데 실패했습니다:", error);
                                if (showAlert) {
                                    alert("위치 정보를 가져올 수 없어요. 위치 권한을 확인해주세요.");
                                }
                            }
                        );
                    } else {
                        console.warn("이 브라우저에서는 위치 정보를 지원하지 않습니다.");
                    }
                }

                // 페이지 로드 시 자동으로 내 위치 찾기 (알림 없이 조용히)
                moveToMyLocation(false);

                // "내 위치" 버튼 클릭 시 다시 내 위치로 이동 (알림 표시)
                document.getElementById("myLocationBtn").addEventListener("click", function () {
                    moveToMyLocation(false);  // true → false로 변경
                });
            });
        };
    </script>
    
    
</body>
</html>
