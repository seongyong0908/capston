<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>비밀번호 재설정 - 데이트코스 추천</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="w-full min-h-screen flex items-center justify-center bg-gradient-to-br from-pink-50 via-white to-purple-50">

  <div class="w-full max-w-md mx-4 rounded-xl border bg-white shadow-lg text-gray-900 p-6 space-y-6">
    
    <div class="text-center space-y-2">
      <div class="mx-auto w-16 h-16 bg-gradient-to-br from-pink-400 to-purple-500 rounded-full flex items-center justify-center">
        <svg class="w-8 h-8 text-white fill-white" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.78 7.78 5.5 5.5 0 0 1 7.78-7.78zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>
      </div>
      <h3 class="font-semibold tracking-tight text-2xl">비밀번호 재설정</h3>
      <p class="text-sm text-gray-500">새로 사용할 비밀번호를 입력해주세요</p>
    </div>

    <form id="resetPasswordForm" class="space-y-4">
      <div class="space-y-2">
        <label for="newPassword" class="text-sm font-medium text-gray-500">새 비밀번호</label>
        <input type="password" id="newPassword" placeholder="8자리 이상 입력해주세요" required 
               class="flex w-full rounded-md border border-gray-300 bg-transparent px-3 py-2 text-sm placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-400 focus:border-transparent h-10">
      </div>

      <div class="space-y-2">
        <label for="confirmPassword" class="text-sm font-medium text-gray-500">새 비밀번호 확인</label>
        <input type="password" id="confirmPassword" placeholder="비밀번호를 한번 더 입력해주세요" required 
               class="flex w-full rounded-md border border-gray-300 bg-transparent px-3 py-2 text-sm placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-400 focus:border-transparent h-10">
      </div>

      <button type="submit" class="inline-flex items-center justify-center rounded-md text-sm font-medium transition-colors w-full h-10 text-white bg-gradient-to-r from-pink-500 to-purple-600 hover:from-pink-600 hover:to-purple-700 shadow-md">
        비밀번호 변경하기
      </button>
    </form>

    <div class="pt-4 border-t text-center">
      <a href="/login.html" class="text-sm text-gray-500 hover:text-gray-900 transition-colors">로그인으로 돌아가기</a>
    </div>

  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
  const urlParams = new URLSearchParams(window.location.search);
  const token = urlParams.get('token');

  if (!token) {
    alert("잘못된 접근입니다. 이메일 재설정 링크를 다시 요청해주세요.");
    window.location.href = '/';
    return;
  }

  const form = document.getElementById('resetPasswordForm');
  form.addEventListener('submit', function(e) {
    e.preventDefault();

    const newPassword = document.getElementById('newPassword').value;
    const confirmPassword = document.getElementById('confirmPassword').value;

    if (newPassword !== confirmPassword) {
      alert("비밀번호가 일치하지 않습니다!");
      return;
    }

    if (newPassword.length < 8) {
      alert("비밀번호는 최소 8자 이상이어야 합니다.");
      return;
    }

    fetch('/api/reset-password', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ token: token, newPassword: newPassword })
    })
    .then(async response => {
      const text = await response.text();
      if (response.ok) {
        alert("비밀번호가 성공적으로 변경되었습니다! 로그인해주세요.");
        window.location.href = '/'; // 💡 /login.html 대신 메인/로그인 페이지(/)로 이동
      } else {
        alert(text || "비밀번호 변경에 실패했습니다.");
      }
    })
    .catch(error => {
      console.error('Error:', error);
      alert("서버 통신 중 오류가 발생했습니다.");
    });
  });
});
  </script>
</body>
</html>
