<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>데이트 캘린더</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f8f9fc] min-h-screen text-gray-800 font-sans antialiased pb-24">

  <div class="max-w-5xl mx-auto px-4 py-8 md:py-12">
    
    <!-- 🌟 상단 타이틀 -->
    <header class="mb-10 text-center flex flex-col items-center">
      <div class="w-16 h-16 bg-gradient-to-tr from-purple-600 to-pink-500 rounded-3xl flex items-center justify-center text-white shadow-xl shadow-purple-500/30 mb-4">
        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
          <rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/>
        </svg>
      </div>
      <h1 class="text-3xl font-black text-gray-900 tracking-tight">우리의 데이트 캘린더</h1>
      <p class="text-gray-500 font-medium mt-2">저장된 코스를 확인하고 일정을 관리해보세요.</p>
    </header>

    <!-- 🌟 메인 달력 영역 (화면 전체를 넓게 씀!) -->
    <section class="bg-white rounded-[2.5rem] p-6 md:p-10 shadow-2xl shadow-purple-900/5 border border-gray-100">
      
      <!-- 연월 및 컨트롤러 -->
      <div class="flex items-center justify-between mb-8 pb-6 border-b border-gray-100">
        <h2 id="calendarTitle" class="text-2xl md:text-3xl font-black text-gray-900 tracking-tight">2026년 9월</h2>
        <div class="flex items-center gap-2 md:gap-4">
          <button id="btnToday" class="px-4 py-2 text-sm font-bold bg-purple-50 hover:bg-purple-100 text-purple-600 rounded-2xl transition-all shadow-sm">
            오늘
          </button>
          <div class="flex items-center bg-gray-50 border border-gray-200/60 rounded-2xl p-1.5 shadow-inner gap-1">
            <button id="btnPrevMonth" class="w-10 h-10 flex items-center justify-center hover:bg-white rounded-xl text-gray-600 transition-all shadow-sm">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="m15 18-6-6 6-6"/></svg>
            </button>
            <button id="btnNextMonth" class="w-10 h-10 flex items-center justify-center hover:bg-white rounded-xl text-gray-600 transition-all shadow-sm">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="m9 18 6-6-6-6"/></svg>
            </button>
          </div>
        </div>
      </div>

      <!-- 요일 헤더 -->
      <div class="grid grid-cols-7 gap-2 md:gap-4 mb-4 text-center text-sm font-bold text-gray-400">
        <div class="text-rose-500 font-extrabold">일</div>
        <div>월</div>
        <div>화</div>
        <div>수</div>
        <div>목</div>
        <div>금</div>
        <div class="text-blue-500 font-extrabold">토</div>
      </div>

      <!-- 날짜 그리드 -->
      <div id="calendarGrid" class="grid grid-cols-7 gap-2 md:gap-4">
        <!-- JS로 동적 생성됨 (칸들이 시원시원해집니다) -->
      </div>
    </section>
  </div>

  <!-- 🌟 [NEW] 날짜 클릭 시 뜨는 '일정 확인 팝업 (모달)' -->
  <div id="scheduleModal" class="hidden fixed inset-0 bg-black/40 backdrop-blur-sm z-40 items-center justify-center p-4">
    <div class="bg-white rounded-[2rem] max-w-md w-full p-8 shadow-2xl border border-gray-100 flex flex-col max-h-[80vh] animate-in fade-in zoom-in duration-200 relative">
      
      <!-- 팝업 닫기 버튼 -->
      <button id="btnCloseSchedule" class="absolute top-6 right-6 text-gray-400 hover:text-gray-700 transition-colors">
        <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>

      <!-- 팝업 헤더 (선택한 날짜 표시) -->
      <div class="mb-6 pr-8">
        <h3 id="selectedDateTitle" class="text-2xl font-extrabold text-gray-900">날짜를 선택하세요</h3>
        <p id="selectedDateCount" class="text-sm font-bold text-purple-600 mt-1"></p>
      </div>

      <!-- 이벤트 목록 (스크롤 가능하게 처리) -->
      <div id="eventListContainer" class="flex-1 overflow-y-auto pr-2 custom-scrollbar">
        <!-- JS가 여기에 일정 카드를 꽂아넣습니다 -->
      </div>

    </div>
  </div>

  <!-- 코스 일정 수정 모달 -->
  <div id="eventModal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-md w-full p-8 shadow-2xl border border-gray-100 animate-in fade-in zoom-in duration-200">
      <div class="flex justify-between items-center mb-6">
        <h3 id="modalTitle" class="text-xl font-extrabold text-gray-900">코스 일정 수정</h3>
        <button id="btnModalClose" class="text-gray-400 hover:text-gray-600 text-2xl font-bold">&times;</button>
      </div>
      
      <input type="hidden" id="eventId">
      <div class="space-y-5">
        
        <div>
          <label class="block text-xs font-bold text-gray-500 uppercase mb-2">제목</label>
          <input type="text" id="eventTitle" placeholder="일정 이름을 입력하세요" class="w-full h-12 px-4 rounded-2xl border border-gray-200 text-sm font-medium focus:outline-none focus:border-purple-500">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-500 uppercase mb-2">날짜</label>
          <input type="date" id="eventDate" class="w-full h-12 px-4 rounded-2xl border border-gray-200 text-sm font-medium focus:outline-none focus:border-purple-500">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-500 uppercase mb-2">시간</label>
          <div class="flex items-center gap-2">
            <input type="time" id="eventTime" class="w-full h-12 px-4 rounded-2xl border border-gray-200 text-sm font-medium focus:outline-none focus:border-purple-500">
            <span class="text-gray-400 font-bold">~</span>
            <input type="time" id="eventEndTime" class="w-full h-12 px-4 rounded-2xl border border-gray-200 text-sm font-medium focus:outline-none focus:border-purple-500">
          </div>
        </div>
        <div class="flex gap-3 pt-4">
          <button id="btnModalCancel" class="flex-1 h-12 bg-gray-100 hover:bg-gray-200 text-gray-700 text-sm font-bold rounded-2xl">취소</button>
          <button id="btnModalSave" class="flex-1 h-12 bg-gradient-to-r from-pink-500 to-purple-600 hover:from-pink-600 text-white text-sm font-bold rounded-2xl shadow-lg">수정 저장</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 캘린더 JS 파일 연결 -->
  <script src="calendar.js?v=course-db"></script>

  <nav class="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t-2 border-gray-200 shadow-2xl z-50" aria-label="주요 메뉴">
    <div class="max-w-7xl mx-auto px-2">
      <div class="grid grid-cols-4">
        <a href="/home" class="relative flex flex-col items-center justify-center py-3 px-1 transition-all text-gray-500 hover:text-purple-500">
          <svg class="w-6 h-6 mb-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          <span class="text-xs font-semibold">홈</span>
        </a>
        <a href="/map" class="relative flex flex-col items-center justify-center py-3 px-1 transition-all text-gray-500 hover:text-purple-500">
          <svg class="w-6 h-6 mb-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
          <span class="text-xs font-semibold">지도보기</span>
        </a>
        <a href="/calendar" aria-current="page" class="relative flex flex-col items-center justify-center py-3 px-1 transition-all text-purple-600">
          <svg class="w-6 h-6 mb-1 fill-purple-100 stroke-purple-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/><path d="M8 14h.01"/><path d="M12 14h.01"/><path d="M16 14h.01"/><path d="M8 18h.01"/><path d="M12 18h.01"/><path d="M16 18h.01"/></svg>
          <span class="text-xs font-semibold">캘린더</span>
          <span class="absolute bottom-0 w-8 h-0.5 bg-purple-600 rounded-full"></span>
        </a>
        <a href="/mypage" class="relative flex flex-col items-center justify-center py-3 px-1 transition-all text-gray-500 hover:text-purple-500">
          <svg class="w-6 h-6 mb-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span class="text-xs font-semibold">마이페이지</span>
        </a>
      </div>
    </div>
  </nav>

</body>
</html>
