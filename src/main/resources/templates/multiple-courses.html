<!-- 코스 추천 해준것 중에 정하는 코스 -->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>추천 코스 선택 - 데이트코스 추천</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/multiple-courses.css">
</head>
<body class="bg-gradient-to-br from-pink-100 via-purple-50 to-blue-50 relative min-h-screen">

  <div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
    <div class="absolute top-0 right-1/3 w-96 h-96 bg-pink-300 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-blob"></div>
    <div class="absolute bottom-0 left-1/3 w-96 h-96 bg-purple-300 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-blob animation-delay-2000"></div>
  </div>

  <header class="border-b bg-white/90 backdrop-blur-md sticky top-0 z-50 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <button id="btnBack" class="p-2 hover:bg-purple-100 rounded-md transition-colors">
          <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <div class="w-12 h-12 bg-gradient-to-br from-pink-400 via-purple-400 to-purple-500 rounded-full flex items-center justify-center shadow-lg shadow-pink-300/50 animate-pulse-slow">
          <svg class="w-6 h-6 text-white" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>
        </div>
        <div>
          <h1 class="text-lg font-bold">추천 코스</h1>
          <p class="text-xs text-gray-500">마음에 드는 코스를 선택하세요</p>
        </div>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-8 space-y-6 pb-32 relative z-10">
    <div class="text-center mb-8">
      <h2 class="text-3xl font-bold mb-2">3가지 코스를 추천했어요!</h2>
      <p class="text-gray-600">마음에 드는 코스를 선택하면 상세 정보를 확인할 수 있어요</p>
    </div>

    <div id="coursesContainer" class="grid md:grid-cols-3 gap-6"></div>

    <div id="actionContainer" class="hidden flex justify-center pt-8">
      <a href="/result.html" class="w-full max-w-md inline-block transition-all duration-500 hover:scale-105">
        <button id="btnSelectCourse" type="button" class="w-full h-16 bg-gradient-to-r from-pink-500 via-purple-500 to-purple-600 shadow-2xl text-white text-lg font-bold rounded-md flex items-center justify-center cursor-pointer">
          <svg class="w-6 h-6 mr-3" xmlns="http://www.w3.org/2000/xl" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>
          <span id="selectCourseText">선택하기</span>
        </button>
      </a>
    </div>
  </main>

  <script src="/multiple-courses.js"></script>
</body>
</html>
