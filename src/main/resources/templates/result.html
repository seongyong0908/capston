<!-- 추천 결과 페이지 -->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>추천 결과 - 데이트코스 추천</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="results.css">
</head>
<body class="bg-gradient-to-br from-pink-100 via-purple-50 to-blue-50 relative min-h-screen">

  <div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
    <div class="absolute top-0 left-1/3 w-96 h-96 bg-pink-300 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-blob"></div>
    <div class="absolute bottom-0 right-1/3 w-96 h-96 bg-purple-300 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-blob animation-delay-2000"></div>
  </div>

  <header class="border-b bg-white/90 backdrop-blur-md sticky top-0 z-50 shadow-lg">
    <div class="max-w-5xl mx-auto px-4 py-5">
      <div class="flex items-center justify-between mb-4">
        <div class="flex items-center gap-3">
          <div class="w-14 h-14 bg-gradient-to-br from-pink-400 via-purple-400 to-purple-500 rounded-full flex items-center justify-center shadow-xl shadow-pink-300/50 animate-pulse-slow">
            <svg class="w-7 h-7 text-white" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>
          </div>
          <div>
            <h1 class="text-2xl font-bold bg-gradient-to-r from-pink-500 to-purple-600 bg-clip-text text-transparent">AI 추천 데이트 코스</h1>
            <p class="text-sm text-gray-500">당신을 위한 맞춤 코스</p>
          </div>
        </div>
        <div class="flex items-center gap-2">
          <button id="btnNavCalendar" class="p-2 hover:bg-blue-100 rounded-md transition-colors"><svg class="w-5 h-5 text-gray-700" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg></button>
          <button id="btnNavMyPage" class="p-2 hover:bg-purple-100 rounded-md transition-colors"><svg class="w-5 h-5 text-gray-700" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></button>
          <button id="btnShare" class="p-2 hover:bg-purple-100 rounded-md transition-colors"><svg class="w-5 h-5 text-gray-700" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" x2="15.42" y1="13.51" y2="17.49"/><line x1="15.41" x2="8.59" y1="6.51" y2="10.49"/></svg></button>
          <button id="btnSaveCourse" class="p-2 hover:bg-pink-100 rounded-md transition-colors">
            <svg id="iconSave" class="w-5 h-5 text-gray-700" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/></svg>
          </button>
        </div>
      </div>
      <div class="flex items-center gap-6 text-sm bg-gradient-to-r from-purple-100 to-pink-100 rounded-full px-6 py-3 flex-wrap">
        <div class="flex items-center gap-2 font-semibold text-purple-700">
          <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          <span id="summaryTime">계산 중...</span>
        </div>
        <div class="flex items-center gap-2 font-semibold text-purple-700">
          <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
          <span id="summaryPlaces">계산 중...</span>
        </div>
        <div class="flex items-center gap-2 font-semibold text-green-700 bg-green-50 px-3 py-1.5 rounded-full">
          <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" x2="12" y1="2" y2="22"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
          <span id="summaryBudget">계산 중...</span>
        </div>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-8 space-y-8 pb-32 relative z-10">
    
    <div class="rounded-xl border-0 shadow-2xl bg-white/90 backdrop-blur-sm overflow-hidden">
      <div class="p-6 pb-3">
        <h3 class="text-xl font-bold flex items-center gap-2">
          <svg class="w-5 h-5 text-blue-500" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
          코스 지도
        </h3>
      </div>
      <div class="p-6 pt-0">
        <div class="relative h-64 bg-gradient-to-br from-blue-50 to-green-50 rounded-xl overflow-hidden border-2 border-gray-200">
          <div class="absolute inset-0">
            <svg class="w-full h-full opacity-20">
              <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M 20 0 L 0 0 0 20" fill="none" stroke="gray" stroke-width="0.5"/></pattern>
              <rect width="100%" height="100%" fill="url(#grid)" />
            </svg>
          </div>
          <div id="simpleMapContainer" class="absolute inset-0 flex items-center justify-center"></div>
        </div>
      </div>
    </div>

    <div class="bg-gradient-to-r from-purple-500 via-pink-500 to-purple-600 rounded-2xl p-6 text-white shadow-2xl">
      <div class="flex items-start gap-4">
        <div class="text-4xl">💡</div>
        <div>
          <h3 class="font-bold text-lg mb-2">코스 이용 팁!</h3>
          <p class="text-sm opacity-90">
            마음에 들지 않는 장소는 새로고침 버튼으로 같은 카테고리의 다른 장소로 바로 교체할 수 있어요!<br>
            각 장소의 "길찾기" 버튼을 누르면 실시간 경로를 확인할 수 있습니다.
          </p>
        </div>
      </div>
    </div>

    <div id="courseListContainer" class="space-y-0"></div>

  </main>

  <div class="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t-2 py-5 px-4 shadow-2xl z-50">
    <div class="max-w-5xl mx-auto flex gap-4">
      <button id="btnRetry" class="inline-flex items-center justify-center rounded-md border-2 border-gray-200 bg-white hover:bg-gray-100 flex-1 h-16 text-base font-semibold">
        <svg class="w-5 h-5 mr-2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>다시 추천받기
      </button>
      <button id="btnStart" class="inline-flex items-center justify-center rounded-md text-white bg-gradient-to-r from-pink-500 via-purple-500 to-purple-600 hover:from-pink-600 flex-1 h-16 text-base font-bold shadow-xl transition-transform hover:scale-105">
        <svg class="w-5 h-5 mr-2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        코스 시작하기
        <svg class="w-5 h-5 ml-2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
      </button>
    </div>
  </div>

  <div id="modalAlternatives" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center z-[100] p-4">
    <div class="rounded-xl border bg-white shadow-2xl w-full max-w-3xl max-h-[85vh] overflow-hidden flex flex-col">
      <div class="p-6 border-b bg-gradient-to-r from-purple-50 to-pink-50 shrink-0">
        <h3 class="text-2xl font-bold flex items-center gap-2">
          <svg class="w-6 h-6 text-purple-600" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
          다른 장소 선택하기
        </h3>
        <p class="text-base text-gray-600 mt-1">마음에 드는 장소를 클릭하여 변경하세요</p>
      </div>
      <div id="alternativesContainer" class="p-6 space-y-3 overflow-y-auto flex-1">
        </div>
      <div class="p-4 border-t shrink-0">
        <button id="btnCancelAlternatives" class="w-full h-12 border-2 border-gray-200 rounded-md font-semibold hover:bg-gray-50">취소</button>
      </div>
    </div>
  </div>

  <div id="modalPlaceDetail" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-50 p-4">
    <div class="rounded-xl border bg-white shadow-2xl w-full max-w-3xl my-8 max-h-[90vh] overflow-y-auto">
      <div class="p-6 border-b flex items-start justify-between">
        <div class="flex items-start gap-4 flex-1">
          <span id="detailEmoji" class="text-6xl"></span>
          <div class="flex-1">
            <h3 id="detailName" class="text-3xl font-bold mb-2"></h3>
            <span id="detailCat" class="inline-block text-sm bg-gradient-to-r from-purple-100 to-pink-100 text-purple-700 px-3 py-1 rounded-full font-semibold"></span>
            <p id="detailDesc" class="text-gray-600 mt-3"></p>
          </div>
        </div>
        <button id="btnDetailClose" class="p-2 hover:bg-gray-100 rounded-md shrink-0">
          <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
      <div class="p-6 space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div class="flex items-center gap-3 bg-yellow-50 p-4 rounded-xl">
            <svg class="w-5 h-5 text-yellow-500 fill-yellow-500" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
            <div>
              <p id="detailRating" class="text-2xl font-bold text-yellow-700"></p>
              <p id="detailReviewCount" class="text-xs text-gray-600"></p>
            </div>
          </div>
          <div class="flex items-center gap-3 bg-blue-50 p-4 rounded-xl">
            <svg class="w-5 h-5 text-blue-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            <div>
              <p class="text-sm font-semibold text-gray-700">예상 소요 시간</p>
              <p id="detailTime" class="text-sm text-gray-600"></p>
            </div>
          </div>
          <div class="flex items-start gap-3 bg-gray-50 p-4 rounded-xl md:col-span-2">
            <svg class="w-5 h-5 text-gray-500 mt-0.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
            <div>
              <p class="text-sm font-semibold text-gray-700">주소</p>
              <p id="detailAddr" class="text-sm text-gray-600"></p>
            </div>
          </div>
        </div>
        <div class="border-t pt-6">
          <h3 class="text-xl font-bold mb-4 flex items-center gap-2">
            <svg class="w-5 h-5 text-purple-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            사용자 리뷰
          </h3>
          <div id="reviewsContainer" class="space-y-4">
            </div>
        </div>
      </div>
    </div>
  </div>

  <script src="results.js"></script>
</body>
</html>
