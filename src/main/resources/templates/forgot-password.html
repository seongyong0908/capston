<!-- 비밀번호 찾기 페이지 -->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>비밀번호 찾기 - 데이트코스 추천</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  
  <link rel="stylesheet" href="forgot-password.css">
</head>
<body>

  <div class="w-full min-h-screen flex items-center justify-center bg-gradient-to-br from-pink-50 via-white to-purple-50">
    
    <div class="w-full max-w-md mx-4 rounded-xl border bg-white shadow-lg text-gray-900">
      
      <div class="flex flex-col space-y-3 p-6 pb-4 text-center">
        <div class="mx-auto w-16 h-16 bg-gradient-to-br from-pink-400 to-purple-500 rounded-full flex items-center justify-center">
          <svg class="w-8 h-8 text-white fill-white" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
        </div>
        <h3 id="cardTitle" class="font-semibold tracking-tight text-2xl">
          비밀번호 찾기
        </h3>
        <p id="cardDescription" class="text-sm text-gray-500">
          가입하신 이메일을 입력해주세요
        </p>
      </div>

      <div class="p-6 pt-0 space-y-4">
        
        <form id="forgotPasswordForm" class="space-y-4">
          <div class="space-y-2">
            <label for="email" class="text-sm font-medium text-gray-500">이메일</label>
            <div class="relative">
              <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
              <input type="email" id="email" placeholder="example@email.com" required 
                     class="flex w-full rounded-md border border-gray-300 bg-transparent px-3 py-2 text-sm placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-purple-400 focus:border-transparent pl-10 h-10">
            </div>
          </div>

          <div class="bg-blue-50 border border-blue-200 rounded-lg p-3 text-sm text-blue-900">
            <p>등록하신 이메일 주소로 비밀번호 재설정 링크를 보내드립니다.</p>
          </div>

          <button type="submit" class="inline-flex items-center justify-center rounded-md text-sm font-medium transition-colors focus-visible:outline-none focus-visible:ring-2 disabled:pointer-events-none disabled:opacity-50 w-full h-10 text-white bg-gradient-to-r from-pink-500 to-purple-600 hover:from-pink-600 hover:to-purple-700 shadow-md">
            재설정 링크 받기
          </button>
        </form>

        <div id="successMessage" class="space-y-4 hidden">
          <div class="flex flex-col items-center justify-center py-6 space-y-4">
            <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center">
              <svg class="w-8 h-8 text-green-600" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>
            </div>
            <div class="text-center space-y-2">
              <p class="text-sm text-gray-500">입력하신 이메일 주소로</p>
              <p class="text-sm text-gray-500">비밀번호 재설정 링크를 발송했습니다.</p>
            </div>
          </div>

          <div class="bg-yellow-50 border border-yellow-200 rounded-lg p-3 text-sm text-yellow-900 space-y-1">
            <p class="font-medium">메일이 오지 않나요?</p>
            <ul class="list-disc list-inside space-y-1 text-xs">
              <li>스팸 메일함을 확인해주세요</li>
              <li>이메일 주소가 정확한지 확인해주세요</li>
              <li>10분 후에도 메일이 오지 않으면 다시 시도해주세요</li>
            </ul>
          </div>

          <button type="button" id="retryBtn" class="inline-flex items-center justify-center rounded-md text-sm font-medium transition-colors focus-visible:outline-none focus-visible:ring-2 disabled:pointer-events-none disabled:opacity-50 border border-gray-200 bg-white hover:bg-gray-100 hover:text-gray-900 w-full h-10">
            다시 시도하기
          </button>
        </div>

        <div class="pt-4 border-t mt-4">
          <a href="/" class="flex items-center justify-center gap-2 text-sm text-gray-500 hover:text-gray-900 transition-colors">
            <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
            <span>로그인으로 돌아가기</span>
          </a>
        </div>

      </div>
    </div>
  </div>

  <script src="forgot-password.js"></script>
</body>
</html>
