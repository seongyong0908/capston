<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>데이트 코스 추천 - 선호도 입력</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="new-preferences.css">
</head>
<body class="bg-gradient-to-br from-pink-100 via-purple-50 to-blue-50 min-h-screen">

  <header class="border-b bg-white/90 backdrop-blur-md sticky top-0 z-50 shadow-sm">
    <div class="max-w-4xl mx-auto px-4 py-4 flex items-center gap-3">
      <button onclick="history.back()" class="p-2 hover:bg-purple-100 rounded-md transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 18l-6-6 6-6"/>
        </svg>
      </button>
      <div class="w-10 h-10 bg-gradient-to-br from-pink-400 to-purple-500 rounded-full flex items-center justify-center shadow-md">
        <span class="text-white text-sm">💕</span>
      </div>
      <div>
        <h1 class="text-lg font-bold">데이트 코스 추천</h1>
        <p class="text-xs text-gray-500">원하시는 조건을 선택해주세요</p>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-8 pb-32 space-y-6">
    
    <div class="bg-white/90 backdrop-blur-sm p-6 rounded-xl shadow-xl border border-white/50">
      <h2 class="text-xl font-bold mb-6 flex items-center gap-2">
        <span class="text-purple-500">📍</span> 기본 정보
      </h2>
      
      <div class="space-y-5">
        <div>
          <label class="block text-sm font-semibold mb-2 text-gray-700">추천받을 지역</label>
          <select id="locSelect" class="w-full h-12 px-4 border-2 border-gray-200 rounded-lg focus:border-purple-500 focus:ring-2 focus:ring-purple-200 outline-none transition-all"></select>
        </div>
        
        <div>
          <label class="block text-sm font-semibold mb-2 text-gray-700">누구랑 놀건지</label>
          <div id="companionContainer" class="flex gap-2">
            </div>
        </div>
        
        <div>
          <label class="block text-sm font-semibold mb-2 text-gray-700">날짜 및 시작 시간</label>
          <div class="grid grid-cols-2 gap-3">
            <input type="date" id="dateInput" class="w-full h-12 px-3 border-2 border-gray-200 rounded-lg focus:border-purple-500 focus:ring-2 focus:ring-purple-200 outline-none transition-all">
            <input type="time" id="startTime" class="w-full h-12 px-3 border-2 border-gray-200 rounded-lg focus:border-purple-500 focus:ring-2 focus:ring-purple-200 outline-none transition-all">
          </div>
        </div>
      </div>
    </div>
    
    <div class="bg-white/90 backdrop-blur-sm p-6 rounded-xl shadow-xl border border-white/50">
      <h2 class="text-xl font-bold mb-2 flex items-center gap-2">
        <span class="text-purple-500">📝</span> 코스 순서 정하기
      </h2>
      <p class="text-sm text-gray-500 mb-4">원하는 카테고리를 순서대로 눌러주세요.</p>
      
      <div id="categoryContainer" class="flex flex-wrap gap-2 mb-6">
        </div>
      
      <div class="bg-gray-50 p-4 rounded-lg border-2 border-dashed border-gray-200 min-h-[100px]">
        <div id="sequenceContainer" class="space-y-2">
          </div>
      </div>
    </div>

    <button id="btnSubmit" class="w-full h-16 bg-gradient-to-r from-pink-500 to-purple-600 hover:from-pink-600 hover:to-purple-700 text-white rounded-xl font-bold text-lg shadow-lg hover:shadow-xl transition-all transform hover:-translate-y-1">
      AI 맞춤 추천 시작하기 ✨
    </button>
  </main>

  <script src="new-preferences.js"></script>
</body>
</html>
