<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>데이트 코스 추천 - 선호도 입력</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="preferences.css">
</head>
<body class="bg-gradient-to-br from-pink-100 via-purple-50 to-blue-50 relative min-h-screen">

  <div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
    <div class="absolute -top-1/2 right-0 w-96 h-96 bg-pink-300 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-blob"></div>
    <div class="absolute bottom-0 -left-1/4 w-96 h-96 bg-purple-300 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-blob animation-delay-2000"></div>
  </div>

  <header class="border-b bg-white/90 backdrop-blur-md sticky top-0 z-50 shadow-sm">
    <div class="max-w-4xl mx-auto px-4 py-4 flex items-center gap-3">
      <button id="btnBack" class="p-2 hover:bg-purple-100 rounded-md transition-colors">
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <div class="w-12 h-12 bg-gradient-to-br from-pink-400 via-purple-400 to-purple-500 rounded-full flex items-center justify-center shadow-lg shadow-pink-300/50 animate-pulse-slow">
        <svg class="w-6 h-6 text-white fill-white" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
      </div>
      <div>
        <h1 class="text-lg font-bold">데이트 코스 추천</h1>
        <p class="text-xs text-gray-500">원하시는 조건을 선택해주세요</p>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-8 pb-32 relative z-10 space-y-6">
    
    <div class="rounded-xl bg-white/90 backdrop-blur-sm shadow-xl p-6">
      <h2 class="text-xl font-bold flex items-center gap-2 mb-6">
        <svg class="w-5 h-5 text-purple-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
        기본 정보
      </h2>
      <div class="space-y-4">
        <div class="space-y-2">
          <label class="text-sm font-semibold text-gray-700">추천받을 지역</label>
          <select id="locSelect" class="w-full h-11 px-3 border-2 rounded-lg focus:outline-none focus:border-purple-500">
            <option value="">지역을 선택하세요</option>
            <option value="홍대/연남동">홍대/연남동</option>
            <option value="강남/청담">강남/청담</option>
            <option value="성수동">성수동</option>
            <option value="잠실">잠실</option>
            <option value="이태원/한남">이태원/한남</option>
            <option value="여의도">여의도</option>
          </select>
        </div>
        
        

        <div class="space-y-2">
          <label class="text-sm font-semibold text-gray-700">날짜</label>
          <input type="date" id="dateInput" class="w-full h-11 px-3 border-2 rounded-lg focus:outline-none focus:border-purple-500">
        </div>

        <div class="space-y-2">
          <label class="text-sm font-semibold text-gray-700">시간</label>
          <div class="grid grid-cols-2 gap-3">
            <div class="relative">
              <input type="time" id="startTime" class="w-full h-11 px-3 border-2 rounded-lg focus:outline-none focus:border-purple-500">
              <span class="absolute right-3 top-1/2 -translate-y-1/2 text-xs text-gray-500">시작</span>
            </div>
            <div class="relative">
              <input type="time" id="endTime" class="w-full h-11 px-3 border-2 rounded-lg focus:outline-none focus:border-purple-500">
              <span class="absolute right-3 top-1/2 -translate-y-1/2 text-xs text-gray-500">종료</span>
            </div>
          </div>
        </div>

        <div class="space-y-2">
          <label class="text-sm font-semibold text-gray-700">인원수</label>
          <input type="number" id="peopleCount" min="1" value="2" class="w-full h-11 px-3 border-2 rounded-lg focus:outline-none focus:border-purple-500">
        </div>

        <div class="space-y-2">
          <label class="text-sm font-semibold text-gray-700">예산 (1인당)</label>
          <input type="number" id="budgetInput" placeholder="원" class="w-full h-11 px-3 border-2 rounded-lg focus:outline-none focus:border-purple-500">
        </div>
      </div>
    </div>

    <div class="rounded-xl bg-white/90 backdrop-blur-sm shadow-xl p-6">
      <div class="mb-5">
        <h2 class="text-xl font-bold flex items-center gap-2">
          <svg class="w-5 h-5 text-blue-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" x2="21" y1="6" y2="6"/><line x1="8" x2="21" y1="12" y2="12"/><line x1="8" x2="21" y1="18" y2="18"/><line x1="3" x2="3.01" y1="6" y2="6"/><line x1="3" x2="3.01" y1="12" y2="12"/><line x1="3" x2="3.01" y1="18" y2="18"/></svg>
          코스 순서 정하기
        </h2>
        <p class="text-sm text-gray-500 mt-1">활동을 눌러 순서대로 담아보세요. 같은 활동을 여러 번 추가할 수 있어요.</p>
      </div>
      
      <div class="flex flex-wrap gap-2 mb-6" id="categoryContainer"></div>

      <div>
        <p class="text-sm font-semibold text-gray-500 mb-2">내 코스 순서 <span id="sequenceCount" class="text-blue-500 ml-2 hidden"></span></p>
        <div id="sequenceContainer" class="space-y-2"></div>
      </div>
    </div>

    <div class="rounded-xl bg-white/90 backdrop-blur-sm shadow-xl p-6">
      <div class="mb-5">
        <h2 class="text-xl font-bold flex items-center gap-2">
          <svg class="w-5 h-5 text-pink-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" x2="9.01" y1="9" y2="9"/><line x1="15" x2="15.01" y1="9" y2="9"/></svg>
          데이트 분위기
        </h2>
        <p class="text-sm text-gray-500 mt-1">원하는 분위기를 모두 선택해주세요</p>
      </div>
      <div class="flex flex-wrap gap-3" id="moodContainer"></div>
    </div>

    <div class="rounded-xl bg-white/90 backdrop-blur-sm shadow-xl p-6">
      <div class="mb-5">
        <h2 class="text-xl font-bold flex items-center gap-2">
          <svg class="w-5 h-5 text-purple-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 21 1.9-5.7a8.5 8.5 0 1 1 3.8 3.8z"/></svg>
          AI에게 하고싶은 말
        </h2>
        <p class="text-sm text-gray-500 mt-1">추가로 원하시는 사항을 자유롭게 입력해주세요</p>
      </div>
      <textarea id="aiMessage" placeholder="예: 조용한 곳이 좋아요, 인스타 감성 카페 추천해주세요..." class="w-full h-32 px-4 py-3 border-2 rounded-lg resize-none focus:outline-none focus:border-purple-500"></textarea>
    </div>

    <button id="btnSubmit" class="w-full h-16 bg-gradient-to-r from-pink-500 via-purple-500 to-purple-600 hover:from-pink-600 hover:to-purple-700 text-white rounded-md shadow-2xl transition-all text-lg font-bold flex items-center justify-center gap-3">
      <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>
      추천 시작
    </button>
  </main>

  <script src="preferences.js"></script>
</body>
</html>
