<!-- 마이페이지 -->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>마이페이지 - 데이트코스 추천</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="mypage.css">
</head>
<body class="bg-gradient-to-br from-pink-100 via-purple-50 to-blue-50 relative min-h-screen">

  <div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
    <div class="absolute top-0 right-1/3 w-96 h-96 bg-pink-300 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-blob"></div>
    <div class="absolute bottom-0 left-1/3 w-96 h-96 bg-purple-300 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-blob animation-delay-2000"></div>
  </div>

  <header class="border-b bg-white/90 backdrop-blur-md sticky top-0 z-50 shadow-sm">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-12 h-12 bg-gradient-to-br from-pink-400 via-purple-400 to-purple-500 rounded-full flex items-center justify-center shadow-lg shadow-pink-300/50 animate-pulse-slow">
          <svg class="w-6 h-6 text-white" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </div>
        <div>
          <h1 class="text-xl font-bold bg-gradient-to-r from-pink-500 to-purple-600 bg-clip-text text-transparent">마이페이지</h1>
          <p class="text-xs text-gray-500">내 정보 및 설정</p>
        </div>
      </div>
      <button id="btnLogout" class="inline-flex items-center justify-center rounded-md text-sm font-medium h-10 px-4 py-2 text-red-600 hover:bg-red-100 hover:text-red-700 transition-colors">
        <svg class="w-5 h-5 mr-2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>
        로그아웃
      </button>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6 relative z-10 pb-28">
    
    <div class="rounded-xl border-0 shadow-2xl bg-white/90 backdrop-blur-sm p-6">
      <div class="flex items-center justify-between flex-wrap gap-4">
        <div class="flex items-center gap-4">
          <div id="profileAvatar" class="w-20 h-20 bg-gradient-to-br from-pink-400 to-purple-600 rounded-full flex items-center justify-center shadow-xl text-white text-3xl font-bold">
            김
          </div>
          <div>
            <h2 id="profileName" class="text-2xl font-semibold tracking-tight">김데이트</h2>
            <p id="profileEmail" class="text-base text-gray-500 pt-1">date@example.com</p>
            <p id="profileJoinDate" class="text-sm text-gray-500">가입일: 2026.03.15</p>
          </div>
        </div>
        <button id="btnEditProfile" class="inline-flex items-center justify-center rounded-md text-sm font-medium border-2 border-gray-200 bg-white hover:bg-purple-50 hover:border-purple-500 h-10 px-4 py-2 transition-colors">
          <svg class="w-4 h-4 mr-2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></svg>
          프로필 수정
        </button>
      </div>
    </div>

    <div id="btnMyTaste" class="rounded-xl border-0 shadow-2xl bg-white/90 backdrop-blur-sm cursor-pointer hover:shadow-purple-200/50 transition-all hover:scale-[1.02] p-6">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-4">
          <div class="w-16 h-16 bg-gradient-to-br from-pink-400 to-purple-600 rounded-full flex items-center justify-center shadow-lg">
            <svg class="w-8 h-8 text-white" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>
          </div>
          <div>
            <h3 class="text-xl font-bold mb-1">내 취향</h3>
            <p id="tasteStatusText" class="text-sm text-gray-600">취향을 확인하고 수정하세요</p>
          </div>
        </div>
        <svg class="w-6 h-6 text-gray-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
      </div>
    </div>

    <div class="rounded-xl border-0 shadow-2xl bg-white/90 backdrop-blur-sm">
      <div class="p-6 pb-4 flex items-center justify-between flex-wrap gap-4 border-b border-gray-100">
        <div>
          <h2 class="text-2xl font-semibold tracking-tight flex items-center gap-2">
            <svg class="w-6 h-6 text-blue-500" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            내 방 관리
          </h2>
          <p class="text-base text-gray-500 pt-1">누구와 함께 할지 방을 만들고 관리하세요</p>
        </div>
        <button id="btnOpenRoomModal" class="inline-flex items-center justify-center rounded-md text-sm font-medium h-10 px-4 py-2 text-white bg-gradient-to-r from-blue-500 to-indigo-600 hover:from-blue-600 hover:to-indigo-700 transition-colors">
          <svg class="w-4 h-4 mr-2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
          방 추가
        </button>
      </div>
      <div id="roomsContainer" class="p-6 space-y-3">
        </div>
    </div>

    <div class="rounded-xl border-0 shadow-2xl bg-white/90 backdrop-blur-sm">
      <div class="p-6 pb-4 border-b border-gray-100">
        <h2 class="text-2xl font-semibold tracking-tight flex items-center gap-2">
          <svg class="w-6 h-6 text-purple-500" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>
          저장된 코스
        </h2>
        <p class="text-base text-gray-500 pt-1">저장한 코스를 확인하고 장소 정보를 살펴보세요</p>
      </div>
      <div id="coursesContainer" class="p-6 space-y-4">
        </div>
    </div>
  </main>

  <div id="modalProfile" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-50 p-4">
    <div class="rounded-xl border bg-white shadow-2xl w-full max-w-md">
      <div class="p-6 pb-4 border-b">
        <h3 class="font-semibold tracking-tight text-2xl">프로필 수정</h3>
        <p class="text-sm text-gray-500">정보를 업데이트해주세요</p>
      </div>
      <div class="p-6 space-y-4">
        <div class="space-y-2">
          <label class="text-sm font-medium text-gray-700">이름</label>
          <input type="text" id="editName" class="flex h-11 w-full rounded-md border-2 border-gray-300 bg-white px-3 focus-visible:outline-none focus-visible:border-purple-500">
        </div>
        <div class="space-y-2">
          <label class="text-sm font-medium text-gray-700">이메일</label>
          <input type="email" id="editEmail" class="flex h-11 w-full rounded-md border-2 border-gray-300 bg-white px-3 focus-visible:outline-none focus-visible:border-purple-500">
        </div>
        <div class="space-y-2">
          <label class="text-sm font-medium text-gray-700">전화번호</label>
          <input type="tel" id="editPhone" class="flex h-11 w-full rounded-md border-2 border-gray-300 bg-white px-3 focus-visible:outline-none focus-visible:border-purple-500">
        </div>
        <div class="flex gap-3 pt-4">
          <button id="btnProfileCancel" class="inline-flex items-center justify-center rounded-md text-sm font-medium border border-gray-200 bg-white hover:bg-gray-100 flex-1 h-11">취소</button>
          <button id="btnProfileSave" class="inline-flex items-center justify-center rounded-md text-sm font-medium text-white bg-gradient-to-r from-pink-500 to-purple-600 hover:from-pink-600 flex-1 h-11">저장</button>
        </div>
      </div>
    </div>
  </div>

  <div id="modalCourseDetail" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-50 p-4 overflow-auto">
    <div class="rounded-xl border bg-white shadow-2xl w-full max-w-2xl my-8">
      <div class="p-6 pb-4 border-b flex items-start justify-between">
        <div class="flex-1">
          <h3 id="detailTitle" class="font-semibold tracking-tight text-2xl mb-2"></h3>
          <div class="flex items-center gap-2 flex-wrap">
            <span id="detailLoc" class="text-sm bg-purple-100 text-purple-700 px-3 py-1 rounded-full"></span>
            <span id="detailDate" class="text-sm text-gray-600"></span>
          </div>
        </div>
        <button id="btnCourseClose" class="p-2 hover:bg-gray-100 rounded-md">
          <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
      <div class="p-6 space-y-3">
        <h3 class="text-lg font-semibold text-gray-900">장소 목록</h3>
        <div id="detailPlacesContainer" class="space-y-2">
          </div>
        <div class="pt-4">
          <button id="btnCourseCloseBottom" class="inline-flex items-center justify-center rounded-md text-sm font-medium border border-gray-200 bg-white hover:bg-gray-100 w-full h-11">닫기</button>
        </div>
      </div>
    </div>
  </div>

  <div id="modalReview" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-50 p-4">
    <div class="rounded-xl border bg-white shadow-2xl w-full max-w-lg">
      <div class="p-6 pb-4 border-b flex items-start justify-between">
        <div class="flex-1">
          <h3 class="font-semibold tracking-tight text-2xl mb-2">리뷰 작성</h3>
          <p id="reviewPlaceName" class="text-sm text-gray-600"></p>
        </div>
        <button id="btnReviewClose" class="p-2 hover:bg-gray-100 rounded-md">
          <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
      <div class="p-6 space-y-4">
        <div class="space-y-2">
          <label class="text-sm font-semibold text-gray-700">별점</label>
          <div id="starContainer" class="flex gap-2">
            </div>
        </div>
        <div class="space-y-2">
          <label class="text-sm font-semibold text-gray-700">리뷰 내용</label>
          <textarea id="reviewText" class="w-full h-32 px-3 py-2 border-2 border-gray-300 rounded-lg resize-none focus:outline-none focus:border-purple-500" placeholder="이 장소에 대한 솔직한 후기를 남겨주세요 😊"></textarea>
        </div>
        <div class="flex gap-3 pt-4">
          <button id="btnReviewCancel" class="inline-flex items-center justify-center rounded-md text-sm font-medium border border-gray-200 bg-white hover:bg-gray-100 flex-1 h-11">취소</button>
          <button id="btnReviewSave" class="inline-flex items-center justify-center rounded-md text-sm font-medium text-white bg-gradient-to-r from-purple-500 to-pink-600 hover:from-purple-600 flex-1 h-11">리뷰 등록</button>
        </div>
      </div>
    </div>
  </div>

  <div id="modalRoom" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-50 p-4 overflow-auto">
    <div class="rounded-xl border bg-white shadow-2xl w-full max-w-lg my-8">
      <div class="p-6 pb-4 border-b flex items-start justify-between">
        <div>
          <h3 class="font-semibold tracking-tight text-2xl flex items-center gap-2">
            <svg class="w-6 h-6 text-blue-500" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            새 방 만들기
          </h3>
          <p class="text-sm text-gray-500">누구와 함께 할지 설정하세요</p>
        </div>
        <button id="btnRoomClose" class="p-2 hover:bg-gray-100 rounded-md">
          <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
      <div class="p-6 space-y-4">
        <div class="space-y-2">
          <label class="text-sm font-medium text-gray-700">방 이름 *</label>
          <input type="text" id="roomName" placeholder="예: 우리 둘만, 친구들과 놀기" class="flex h-11 w-full rounded-md border-2 border-gray-300 bg-white px-3 focus-visible:outline-none focus-visible:border-blue-500">
        </div>
        <div class="space-y-2">
          <label class="text-sm font-medium text-gray-700">방 타입 *</label>
          <div class="grid grid-cols-3 gap-3" id="roomTypeContainer">
            <button data-type="couple" class="room-type-btn p-3 rounded-xl border-2 border-gray-200 hover:border-pink-300 transition-all bg-pink-50 border-pink-500 shadow-md">
              <div class="text-2xl mb-1">💕</div><div class="text-sm font-semibold">연인</div>
            </button>
            <button data-type="friend" class="room-type-btn p-3 rounded-xl border-2 border-gray-200 hover:border-yellow-300 transition-all">
              <div class="text-2xl mb-1">⭐</div><div class="text-sm font-semibold">친구</div>
            </button>
            <button data-type="family" class="room-type-btn p-3 rounded-xl border-2 border-gray-200 hover:border-green-300 transition-all">
              <div class="text-2xl mb-1">👨‍👩‍👧‍👦</div><div class="text-sm font-semibold">가족</div>
            </button>
          </div>
        </div>
        <div class="space-y-2">
          <label class="text-sm font-medium text-gray-700">멤버 추가 (선택)</label>
          <div class="flex gap-2">
            <input type="text" id="memberName" placeholder="이름" class="flex h-10 w-full rounded-md border-2 border-gray-300 px-3 text-sm focus-visible:outline-none focus-visible:border-blue-500">
            <input type="text" id="memberRel" placeholder="관계" class="flex h-10 w-full rounded-md border-2 border-gray-300 px-3 text-sm focus-visible:outline-none focus-visible:border-blue-500">
            <button id="btnAddMember" class="inline-flex items-center justify-center rounded-md border border-gray-200 hover:bg-gray-100 h-10 w-12 shrink-0">
              <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" x2="19" y1="8" y2="14"/><line x1="22" x2="16" y1="11" y2="11"/></svg>
            </button>
          </div>
          <div id="addedMembersContainer" class="flex flex-wrap gap-2 mt-2"></div>
        </div>
        <div class="flex gap-3 pt-4">
          <button id="btnRoomCancel" class="inline-flex items-center justify-center rounded-md text-sm font-medium border border-gray-200 bg-white hover:bg-gray-100 flex-1 h-11">취소</button>
          <button id="btnRoomSave" class="inline-flex items-center justify-center rounded-md text-sm font-medium text-white bg-gradient-to-r from-blue-500 to-indigo-600 hover:from-blue-600 flex-1 h-11">생성</button>
        </div>
      </div>
    </div>
  </div>

  <script src="mypage.js"></script>
</body>
</html>
