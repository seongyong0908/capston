<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회원가입 - 데이트코스 추천</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  
  <link rel="stylesheet" href="signup.css">
</head>
<body>

  <div class="w-full min-h-screen flex items-center justify-center bg-gradient-to-br from-pink-100 via-purple-50 to-blue-50 py-12 relative overflow-hidden">
    
    <div class="absolute inset-0 overflow-hidden pointer-events-none">
      <div class="absolute -top-1/2 -left-1/4 w-96 h-96 bg-pink-300 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-blob"></div>
      <div class="absolute -top-1/2 -right-1/4 w-96 h-96 bg-purple-300 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-blob animation-delay-2000"></div>
      <div class="absolute -bottom-1/2 left-1/3 w-96 h-96 bg-blue-300 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-blob animation-delay-4000"></div>
    </div>

    <div class="absolute inset-0 pointer-events-none">
      <svg class="absolute top-20 left-20 w-8 h-8 text-pink-300 fill-pink-300 animate-float opacity-40" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
      <svg class="absolute top-1/3 right-20 w-6 h-6 text-purple-400 animate-pulse opacity-40" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>
    </div>

    <div class="w-full max-w-md mx-4 rounded-xl border bg-white/95 text-gray-950 shadow-2xl backdrop-blur-sm relative z-10 hover:shadow-pink-200/50 transition-all duration-300 my-8">
      
      <div class="flex flex-col space-y-4 p-6 text-center pb-6">
        <div class="mx-auto w-20 h-20 bg-gradient-to-br from-pink-400 via-purple-400 to-purple-500 rounded-full flex items-center justify-center shadow-lg shadow-pink-300/50 animate-pulse-slow">
          <svg class="w-10 h-10 text-white fill-white" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
        </div>
        <div class="space-y-2">
          <h3 class="font-semibold tracking-tight text-3xl bg-gradient-to-r from-pink-500 to-purple-600 bg-clip-text text-transparent">
            회원가입
          </h3>
          <p class="text-sm text-gray-500 text-base">
            ✨ 완벽한 데이트를 위한 첫 걸음
          </p>
        </div>
      </div>

      <div class="p-6 pt-0 space-y-5 px-8 pb-8">
        
        <form id="signupForm" class="space-y-5">
          <div class="space-y-2">
            <label for="name" class="text-sm font-medium text-gray-700">이름</label>
            <div class="relative group">
              <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400 group-focus-within:text-purple-500 transition-colors" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              <input id="name" type="text" placeholder="홍길동" required 
                     class="flex w-full rounded-md border border-gray-300 bg-white px-3 py-2 text-sm ring-offset-white placeholder:text-gray-500 focus-visible:outline-none focus-visible:ring-2 disabled:cursor-not-allowed disabled:opacity-50 pl-11 h-11 border-2 focus:border-purple-500 focus:ring-purple-200 transition-all">
            </div>
          </div>

          <div class="space-y-2">
            <label for="username" class="text-sm font-medium text-gray-700">아이디</label>
            <div class="relative group">
              <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400 group-focus-within:text-purple-500 transition-colors" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              <input id="username" type="text" placeholder="아이디를 입력하세요" required 
                     class="flex w-full rounded-md border border-gray-300 bg-white px-3 py-2 text-sm ring-offset-white placeholder:text-gray-500 focus-visible:outline-none focus-visible:ring-2 disabled:cursor-not-allowed disabled:opacity-50 pl-11 h-11 border-2 focus:border-purple-500 focus:ring-purple-200 transition-all">
            </div>
          </div>

          <div class="space-y-2">
            <label for="email" class="text-sm font-medium text-gray-700">
              이메일 <span class="text-gray-400 text-xs">(선택 - 아이디/비밀번호 찾기용)</span>
            </label>
            <div class="relative group">
              <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400 group-focus-within:text-purple-500 transition-colors" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
              <input id="email" type="email" placeholder="example@email.com" 
                     class="flex w-full rounded-md border border-gray-300 bg-white px-3 py-2 text-sm ring-offset-white placeholder:text-gray-500 focus-visible:outline-none focus-visible:ring-2 disabled:cursor-not-allowed disabled:opacity-50 pl-11 h-11 border-2 focus:border-purple-500 focus:ring-purple-200 transition-all">
            </div>
          </div>

          <div class="space-y-2">
            <label for="phone" class="text-sm font-medium text-gray-700">휴대폰 번호</label>
            <div class="relative group">
              <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400 group-focus-within:text-purple-500 transition-colors" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
              <input id="phone" type="tel" placeholder="010-1234-5678" required 
                     class="flex w-full rounded-md border border-gray-300 bg-white px-3 py-2 text-sm ring-offset-white placeholder:text-gray-500 focus-visible:outline-none focus-visible:ring-2 disabled:cursor-not-allowed disabled:opacity-50 pl-11 h-11 border-2 focus:border-purple-500 focus:ring-purple-200 transition-all">
            </div>
          </div>

          <div class="space-y-2">
            <label for="password" class="text-sm font-medium text-gray-700">비밀번호</label>
            <div class="relative group">
              <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400 group-focus-within:text-purple-500 transition-colors" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              <input id="password" type="password" placeholder="8자 이상 입력해주세요" required minlength="8"
                     class="flex w-full rounded-md border border-gray-300 bg-white px-3 py-2 text-sm ring-offset-white placeholder:text-gray-500 focus-visible:outline-none focus-visible:ring-2 disabled:cursor-not-allowed disabled:opacity-50 pl-11 h-11 border-2 focus:border-purple-500 focus:ring-purple-200 transition-all">
            </div>
          </div>

          <div class="space-y-2">
            <label for="password-confirm" class="text-sm font-medium text-gray-700">비밀번호 확인</label>
            <div class="relative group">
              <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400 group-focus-within:text-purple-500 transition-colors" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              <input id="password-confirm" type="password" placeholder="비밀번호를 다시 입력해주세요" required minlength="8"
                     class="flex w-full rounded-md border border-gray-300 bg-white px-3 py-2 text-sm ring-offset-white placeholder:text-gray-500 focus-visible:outline-none focus-visible:ring-2 disabled:cursor-not-allowed disabled:opacity-50 pl-11 h-11 border-2 focus:border-purple-500 focus:ring-purple-200 transition-all">
            </div>
          </div>

          <div class="space-y-3 pt-3">
            <label class="flex items-start gap-2 cursor-pointer group">
              <input type="checkbox" required class="mt-1 rounded border-gray-300 text-purple-600 focus:ring-purple-500 w-4 h-4">
              <span class="text-sm text-gray-600 group-hover:text-gray-900">
                <span class="text-gray-900 font-semibold">(필수)</span> 이용약관 및 개인정보처리방침에 동의합니다
              </span>
            </label>
            <label class="flex items-start gap-2 cursor-pointer group">
              <input type="checkbox" class="mt-1 rounded border-gray-300 text-purple-600 focus:ring-purple-500 w-4 h-4">
              <span class="text-sm text-gray-600 group-hover:text-gray-900">
                <span class="text-gray-900 font-semibold">(선택)</span> 마케팅 정보 수신에 동의합니다
              </span>
            </label>
          </div>

          <button type="submit" class="inline-flex items-center justify-center rounded-md text-sm ring-offset-white focus-visible:outline-none focus-visible:ring-2 disabled:pointer-events-none disabled:opacity-50 w-full h-12 bg-gradient-to-r from-pink-500 via-purple-500 to-purple-600 hover:from-pink-600 hover:via-purple-600 hover:to-purple-700 shadow-lg shadow-purple-300/50 hover:shadow-xl hover:shadow-purple-400/50 transition-all duration-300 text-white text-base font-semibold">
            가입하기
          </button>
        </form>

        <div class="relative py-4">
          <div class="absolute inset-0 flex items-center">
            <span class="w-full border-t-2 border-gray-200"></span>
          </div>
          <div class="relative flex justify-center text-sm">
            <span class="bg-white px-4 text-gray-500 font-medium">
              또는 간편 가입
            </span>
          </div>
        </div>

        <div class="space-y-3">
          <button type="button" class="inline-flex items-center justify-center rounded-md text-sm font-medium ring-offset-white focus-visible:outline-none focus-visible:ring-2 disabled:pointer-events-none disabled:opacity-50 bg-white w-full h-12 border-2 border-gray-200 hover:border-yellow-400 hover:bg-yellow-50 transition-all duration-300 shadow-md hover:shadow-lg">
            <svg class="w-6 h-6 mr-3" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 3C6.48 3 2 6.58 2 11c0 2.78 1.83 5.23 4.58 6.68-.2.7-.65 2.28-.74 2.64-.1.44.16.43.34.31.14-.09 2.04-1.37 2.84-1.91.64.09 1.3.14 1.98.14 5.52 0 10-3.58 10-8S17.52 3 12 3z" fill="#FEE500"/>
            </svg>
            <span class="text-gray-800 font-semibold">카카오로 시작하기</span>
          </button>

          <button type="button" class="inline-flex items-center justify-center rounded-md text-sm font-medium ring-offset-white focus-visible:outline-none focus-visible:ring-2 disabled:pointer-events-none disabled:opacity-50 bg-white w-full h-12 border-2 border-gray-200 hover:border-blue-400 hover:bg-blue-50 transition-all duration-300 shadow-md hover:shadow-lg">
            <svg class="w-6 h-6 mr-3" viewBox="0 0 24 24">
              <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
              <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
              <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
              <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>
            <span class="text-gray-800 font-semibold">Google로 시작하기</span>
          </button>
        </div>

        <div class="text-center text-sm text-gray-600 pt-4">
          이미 계정이 있으신가요? 
          <a href="/login.html" class="text-purple-600 hover:text-purple-700 font-semibold hover:underline transition-colors">
            로그인
          </a>
        </div>
      </div>
    </div>
  </div>

  <script src="signup.js"></script>
</body>
</html>
