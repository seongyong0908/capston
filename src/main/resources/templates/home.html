<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>데이트 코스 추천 - 홈</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="home.css">
</head>
<body id="bodyContainer" class="bg-gradient-to-br flex flex-col overflow-auto min-h-screen transition-colors duration-500">

  <div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
    <div id="blob1" class="absolute top-0 right-0 w-96 h-96 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-blob transition-colors duration-500"></div>
    <div id="blob2" class="absolute bottom-0 left-0 w-96 h-96 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-blob animation-delay-2000 transition-colors duration-500"></div>
  </div>

  <main class="relative z-10 pb-24">
    <div class="min-h-screen flex items-center justify-center px-4 py-12">
      <div class="max-w-2xl w-full space-y-8 text-center">
        
        <div class="mx-auto mb-4">
          <button id="btnOpenRoomSelector" class="inline-flex items-center gap-2 bg-white/90 backdrop-blur-sm px-4 py-2 rounded-full shadow-lg border-2 border-gray-200 hover:border-blue-400 hover:shadow-xl transition-all cursor-pointer">
            <svg class="w-4 h-4 text-gray-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            <span id="activeRoomName" class="text-sm font-semibold text-gray-700">방 선택하기</span>
            <span id="activeRoomEmoji" class="text-lg"></span>
            <svg class="w-4 h-4 text-gray-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
          </button>
        </div>

        <div id="heroLogo" class="mx-auto w-24 h-24 rounded-full flex items-center justify-center shadow-xl animate-pulse-slow transition-all duration-500">
          <div id="heroEmoji" class="text-4xl">💕</div>
        </div>

        <div class="space-y-4">
          <h1 class="text-5xl sm:text-6xl font-extrabold text-gray-900 leading-tight">
            <span id="heroTitle1">완벽한 데이트 코스를</span><br />
            <span id="heroTitle2" class="bg-clip-text text-transparent transition-colors duration-500">AI가 추천해드립니다</span>
          </h1>
          <p id="heroSubtitle" class="text-xl text-gray-600 max-w-lg mx-auto">더 이상 데이트 계획으로 고민하지 마세요 💕</p>
        </div>

        <div class="bg-gradient-to-r from-blue-400 to-blue-600 text-white max-w-md mx-auto rounded-xl shadow-xl overflow-hidden">
          <div class="p-6 flex items-center justify-between">
            <div class="flex items-center gap-4">
              <span class="text-6xl">☀️</span>
              <div class="text-left">
                <p class="text-sm opacity-90 mb-1">서울 현재 날씨</p>
                <p class="text-4xl font-bold">22°C</p>
                <p class="text-sm opacity-90 mt-1">맑고 화창함</p>
              </div>
            </div>
          </div>
        </div>

        <button id="btnStartRecommend" class="text-xl px-12 py-6 text-white rounded-md shadow-2xl transition-all duration-500 hover:scale-105 inline-flex items-center">
          <svg class="w-6 h-6 mr-3" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>
          추천받기
        </button>

        <p id="noRoomNotice" class="text-sm text-gray-500 mt-4">💡 마이페이지에서 방을 만들면 맞춤형 추천을 받을 수 있어요!</p>
      </div>
    </div>

    <div class="px-4 py-12 bg-white/50 backdrop-blur-sm">
      <div class="max-w-6xl mx-auto">
        <div class="mb-6">
          <h2 class="text-2xl font-bold text-gray-900 flex items-center gap-2">
            <svg class="w-6 h-6 text-purple-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>
            인기 코스
          </h2>
          <p class="text-sm text-gray-600 mt-1">다른 사람들이 만든 인기 코스를 확인해보세요</p>
        </div>
        <div id="popularCoursesContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>
      </div>
    </div>
  </main>

  <div id="roomSelectorModal" class="hidden fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-50 p-4">
    <div class="rounded-xl border bg-white shadow-2xl w-full max-w-lg">
      <div class="p-6 border-b flex items-start justify-between">
        <div>
          <h3 class="text-2xl font-bold flex items-center gap-2">
            <svg class="w-6 h-6 text-blue-500" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
            방 선택하기
          </h3>
          <p class="text-sm text-gray-500 mt-1">누구와 함께 할지 선택하면 맞춤 추천을 받을 수 있어요</p>
        </div>
        <button id="btnRoomClose" class="p-2 hover:bg-gray-100 rounded-md">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
      <div class="p-6 space-y-3" id="roomListContainer"></div>
    </div>
  </div>

  <nav class="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t-2 border-gray-200 shadow-2xl z-50">
    <div class="max-w-7xl mx-auto px-2">
      <div class="grid grid-cols-4">
        <button onclick="window.location.href='/home'" class="relative flex flex-col items-center justify-center py-3 px-1 transition-all text-purple-600">
          <svg class="w-6 h-6 mb-1 fill-purple-100 stroke-purple-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          <span class="text-xs font-semibold">홈</span>
          <span class="absolute bottom-0 w-8 h-0.5 bg-purple-600 rounded-full"></span>
        </button>

        <button onclick="window.location.href='/map'" class="relative flex flex-col items-center justify-center py-3 px-1 transition-all text-gray-500 hover:text-purple-500">
          <svg class="w-6 h-6 mb-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
          <span class="text-xs font-semibold">지도보기</span>
        </button>

        <button onclick="window.location.href='/calendar'" class="relative flex flex-col items-center justify-center py-3 px-1 transition-all text-gray-500 hover:text-purple-500">
          <svg class="w-6 h-6 mb-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/><path d="M8 14h.01"/><path d="M12 14h.01"/><path d="M16 14h.01"/><path d="M8 18h.01"/><path d="M12 18h.01"/><path d="M16 18h.01"/></svg>
          <span class="text-xs font-semibold">캘린더</span>
        </button>

        <button onclick="window.location.href='/mypage'" class="relative flex flex-col items-center justify-center py-3 px-1 transition-all text-gray-500 hover:text-purple-500">
          <svg class="w-6 h-6 mb-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span class="text-xs font-semibold">마이페이지</span>
        </button>
      </div>
    </div>
  </nav>

  <script src="home.js"></script>
</body>
</html>
