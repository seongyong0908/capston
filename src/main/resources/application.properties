# 서버 설정 하는 파일

spring.application.name=date-app

# 1. DB 접속 정보 (친구들은 여기서 password만 본인걸로 고치면 됩니다)
spring.datasource.url=jdbc:mysql://localhost:3306/capstone?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
#                                                 capstone?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=8208
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 2. SQL 자동 실행 설정 (추가된 핵심 부분!)
spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


# 4. Hibernate 설정
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

